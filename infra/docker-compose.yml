services:
  db:
    image: pgvector/pgvector:pg17
    container_name: reai-db
    environment:
      POSTGRES_USER: reai
      POSTGRES_PASSWORD: reai_dev_password
      POSTGRES_DB: reai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reai -d reai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: